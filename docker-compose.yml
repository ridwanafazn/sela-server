name: sela-server

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sela
      POSTGRES_PASSWORD: sela
      POSTGRES_DB: sela
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sela -d sela"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
